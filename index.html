     <style amp-custom>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* NEBULA */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(212, 175, 55, 0.18), transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(184, 134, 11, 0.15), transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(255, 215, 0, 0.12), transparent 40%);
            animation: nebulaMove 15s infinite alternate ease-in-out;
            z-index: 0;
        }

        /* BINTANG RANDOM */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 10% 20%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 20% 80%, #fff, transparent),
                radial-gradient(2px 2px at 30% 50%, #fff, transparent),
                radial-gradient(1px 1px at 40% 30%, #fff, transparent),
                radial-gradient(2px 2px at 50% 70%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60% 10%, #fff, transparent),
                radial-gradient(2px 2px at 70% 60%, #fff, transparent),
                radial-gradient(1px 1px at 80% 40%, #fff, transparent),
                radial-gradient(2px 2px at 90% 90%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 15% 60%, #fff, transparent),
                radial-gradient(2px 2px at 25% 10%, #fff, transparent),
                radial-gradient(1px 1px at 35% 85%, #fff, transparent),
                radial-gradient(2px 2px at 55% 40%, #fff, transparent),
                radial-gradient(1px 1px at 65% 75%, #fff, transparent),
                radial-gradient(2px 2px at 75% 25%, #fff, transparent),
                radial-gradient(1px 1px at 85% 65%, #fff, transparent);
            animation: twinkle 2s infinite alternate;
            z-index: 1;
        }

        /* SHOOTING STAR */
        .shooting-star-cakwe {
            position: absolute;
            width: 2px;
            height: 80px;
            background: linear-gradient(-45deg, #ffd700, transparent);
            opacity: 0;
            transform: rotate(45deg);
            animation: shooting 3s linear infinite;
        }

        .shooting-star-cakwe:nth-child(1) {
            top: 10%;
            left: 80%;
            animation-delay: 0s;
        }

        .shooting-star-cakwe:nth-child(2) {
            top: 30%;
            left: 60%;
            animation-delay: 1.5s;
        }

        .shooting-star-cakwe:nth-child(3) {
            top: 50%;
            left: 90%;
            animation-delay: 3s;
        }

        /* ANIMASI */
        @keyframes nebulaMove {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.6;
            }

            100% {
                transform: scale(1.2) translate(-30px, 30px);
                opacity: 1;
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                filter: brightness(0.8);
            }

            100% {
                opacity: 1;
                filter: brightness(1.6);
            }
        }

        @keyframes shooting {
            0% {
                transform: translate(0, 0) rotate(45deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translate(-300px, 300px) rotate(45deg);
                opacity: 0;
            }
        }

        .card {
  max-width: 400px;
  width: 100%;

    radial-gradient(circle at top, rgba(212, 175, 55, 0.08), transparent 34%),

  z-index: 10;

}

.card:hover {

}

/* Efek border gradient berjalan */
.card::before {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 43px 43px 33px 33px;
  background: linear-gradient(
    120deg,
    #0d0d0d,
    #2a2a2a,
    #8b7355,
    #d4af37,
    #ffd700,
    #b8860b,
    #0d0d0d
  );

  z-index: -1;

@keyframes cardBorderFlow {
  0% {
    background-position: 0% 50%;
  }


  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

/* Efek cahaya hidup di dalam card */

  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.07), transparent 28%),
    radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.1), transparent 30%),
    linear-gradient(120deg, transparent, rgba(212, 175, 55, 0.035), transparent);

  animation: cardLightMove 6s ease-in-out infinite alternate;
  z-index: 0;
}

@keyframes cardLightMove {
  from {
    opacity: .28;
    transform: translateX(-10px);

  to {

}

.card > * {

}

/* Header */

  }

    text-shadow:

/* Hero image */
.hero-area {

  justify-content: center;

.image-frame {

}

.image-frame::before {

  top: -8px;
  left: -8px;
  right: -8px;

  background: linear-gradient(145deg, #0d0d0d, #8b7355, #d4af37, #ffd700, #b8860b);

}

/* Efek aura berputar di belakang gambar */
.image-frame::after {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 34px;
  background: conic-gradient(
    from 0deg,
    transparent,
    #0d0d0d,
    #8b7355,
    #d4af37,
    #ffd700,
    #b8860b,
    transparent
  );
  z-index: -2;
  animation: rotateAura 5s linear infinite;
  opacity: 0.38;
}

@keyframes rotateAura {
  to {
    transform: rotate(360deg);
  }
}

@keyframes glowPulse {
  from {
    opacity: 0.22;
    filter: blur(14px);
  }

  to {
    opacity: 0.45;
    filter: blur(22px);
  }
}

.btn-register {

/* Efek shine tombol daftar */
.btn-register::before {
  content: "";
  position: absolute;
  top: 0;
  left: -70%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .45), transparent);
  transform: skewX(-20deg);
  transition: 0.5s;
}

.btn-register:hover::before {
  left: 120%;
}

.btn-register::after {
  content: "";
  position: absolute;
  top: -40%;
  left: -80%;

  height: 180%;

    120deg,

/* Jackpot */
.jepe-box {
  background: #0d0d0d;

  grid-template-columns: repeat(4, 1fr);

}
